<!-- ── Lightbox ─────────────────────────────────────────────────── -->
<div
  class="handwritten-reviews__lightbox"
  id="reviews-lightbox"
  role="dialog"
  aria-modal="true"
  aria-label="Review image viewer"
  hidden
>
  <div class="handwritten-reviews__lightbox-overlay"></div>
  <div class="handwritten-reviews__lightbox-inner">
    <button class="handwritten-reviews__lightbox-close" aria-label="Close image viewer">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="handwritten-reviews__lightbox-prev" aria-label="Previous image">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <figure class="handwritten-reviews__lightbox-figure">
      <img id="lightbox-img" src="" alt="" class="handwritten-reviews__lightbox-img">
    </figure>
    <button class="handwritten-reviews__lightbox-next" aria-label="Next image">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <p class="handwritten-reviews__lightbox-counter" id="lightbox-counter" aria-live="polite"></p>
</div>

<script>
(function () {
  // ── Accordion ──────────────────────────────────────────────────────────────
  var allToggles = document.querySelectorAll('.handwritten-reviews__toggle');

  function closeAll(except) {
    allToggles.forEach(function (btn) {
      if (btn === except) return;
      btn.setAttribute('aria-expanded', 'false');
      document.getElementById(btn.getAttribute('aria-controls')).hidden = true;
    });
  }

  allToggles.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var expanded = this.getAttribute('aria-expanded') === 'true';
      if (!expanded) closeAll(this);
      this.setAttribute('aria-expanded', String(!expanded));
      document.getElementById(this.getAttribute('aria-controls')).hidden = expanded;
    });
  });

  // ── Lightbox ───────────────────────────────────────────────────────────────
  var lightbox     = document.getElementById('reviews-lightbox');
  var lbImg        = document.getElementById('lightbox-img');
  var lbCounter    = document.getElementById('lightbox-counter');
  var lbClose      = document.querySelector('.handwritten-reviews__lightbox-close');
  var lbPrev       = document.querySelector('.handwritten-reviews__lightbox-prev');
  var lbNext       = document.querySelector('.handwritten-reviews__lightbox-next');
  var lbOverlay    = document.querySelector('.handwritten-reviews__lightbox-overlay');

  var currentImages = [];
  var currentIndex  = 0;

  function openLightbox(imgs, idx) {
    currentImages = imgs;
    currentIndex  = idx;
    render();
    lightbox.hidden = false;
    document.body.classList.add('lightbox-open');
    lbClose.focus();
  }

  function closeLightbox() {
    lightbox.hidden = true;
    document.body.classList.remove('lightbox-open');
  }

  function render() {
    var img = currentImages[currentIndex];
    lbImg.src = img.src;
    lbImg.alt = img.alt;
    lbCounter.textContent = (currentIndex + 1) + ' / ' + currentImages.length;
    lbPrev.disabled = currentIndex === 0;
    lbNext.disabled = currentIndex === currentImages.length - 1;
  }

  document.querySelectorAll('.handwritten-reviews__lightbox-trigger').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      var panel   = this.closest('.handwritten-reviews__panel');
      var allImgs = Array.from(panel.querySelectorAll('.handwritten-reviews__lightbox-trigger img'));
      var clicked = this.querySelector('img');
      openLightbox(allImgs, allImgs.indexOf(clicked));
    });
  });

  lbClose.addEventListener('click', closeLightbox);
  lbOverlay.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', function () { if (currentIndex > 0) { currentIndex--; render(); } });
  lbNext.addEventListener('click', function () { if (currentIndex < currentImages.length - 1) { currentIndex++; render(); } });

  document.addEventListener('keydown', function (e) {
    if (lightbox.hidden) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  { if (currentIndex > 0) { currentIndex--; render(); } }
    if (e.key === 'ArrowRight') { if (currentIndex < currentImages.length - 1) { currentIndex++; render(); } }
  });
}());
</script>
