name: Lint

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: PHP lint and security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none

      # phpcs and the WordPress standards are require-dev, so this stage keeps them.
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run lint
        run: composer run lint:run
